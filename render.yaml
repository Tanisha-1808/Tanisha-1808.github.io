services:
  - type: web
    name: fieldwise-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DISEASE_MODEL_URL
        sync: false
      - key: MARKET_API_URL
        sync: false
      - key: MODEL_EVALUATION_PATH
        sync: false
      - key: CROP_MODEL_PATH
        value: models/crop_recommender.joblib
  - type: static
    name: fieldwise-web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
